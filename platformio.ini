[platformio]
default_envs = proton

[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
build_src_flags = -O0
build_src_filter = +<main.c> +<display.c> +<bme280.c> +<light.c> +<alarm.c>
build_flags =
    -DPICO_RP2350B=1
    -DPIO_NO_STDIO_UART
    -DROOM_ENABLE_ALARM=0
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200

[env:ldr_test]
extends = env:proton
build_flags =
    ${env:proton.build_flags}
    -DROOM_TEST_MODE=1

[env:bme_test]
extends = env:proton
build_flags =
    ${env:proton.build_flags}
    -DROOM_TEST_MODE=2

[env:tft_test]
extends = env:proton
build_flags =
    ${env:proton.build_flags}
    -DROOM_TEST_MODE=3
